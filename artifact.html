<title>ざんねんなAI開発図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+1+Code:wght@400;500&display=swap">
<style>
/* 図鑑：白い紙に標本カードを並べる。表紙の黄色を1色だけ。カードを押すと標本の解説ページが開く */
:root{
  --paper:#fbfbf8; --card:#ffffff; --ink:#22262e; --sub:#5f6672; --line:#e2e0d6;
  --yellow:#f5c400; --yellow-soft:#fff5c2; --leaf:#2f8f5b; --leaf-soft:#e2f3e9; --gray-soft:#eef0f3;
  --shade:rgba(20,22,28,.45);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-mono:"M PLUS 1 Code",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1c21; --card:#23262c; --ink:#eceae4; --sub:#a9aeb7; --line:#373b43;
  --yellow:#f5c400; --yellow-soft:#3a3214; --leaf:#6fd09a; --leaf-soft:#1e3a2a; --gray-soft:#2c3038; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1c21; --card:#23262c; --ink:#eceae4; --sub:#a9aeb7; --line:#373b43;
  --yellow:#f5c400; --yellow-soft:#3a3214; --leaf:#6fd09a; --leaf-soft:#1e3a2a; --gray-soft:#2c3038; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 表紙 */
header.cover{display:grid;gap:12px;padding-block:16px 24px;border-bottom:3px solid var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--sub)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,7vw,60px);line-height:1.15;margin:0;text-wrap:balance}
h1 .z{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding-inline:.06em}
.lead{max-width:42em;margin:0;color:var(--sub)}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--sub)}
.stats b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}

/* はじめに・目次 */
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-block:28px}
.howto h2,.toc h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 10px}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:14px}
.toc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc a{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none}
.toc a:hover{border-color:var(--ink)}
.toc .n{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--sub)}

/* 検索 */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
#q{flex:1 1 240px;min-width:0;font:inherit;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus{border-color:var(--ink);outline:none}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--yellow);color:#22262e}
.btn:disabled{opacity:.35;cursor:default}
.count{font-size:13px;color:var(--sub);width:100%}
.count:empty{display:none}

/* 分類と標本カード */
section.group{margin-top:36px;scroll-margin-top:80px}
section.group h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
section.group h2 small{font-family:var(--f-body);font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.spec{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-width:0;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.spec:hover{border-color:var(--ink)}
.spec:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.spec .top{display:flex;align-items:center;gap:8px;color:var(--sub)}
.spec .no{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--ink)}
.spec .ok{margin-left:auto;font-size:11px;color:var(--leaf);font-weight:700}
.spec h3{font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1.5;margin:0;text-wrap:pretty}
.spec .short{font-size:13px;line-height:1.6;color:var(--ink);background:var(--yellow-soft);border-radius:6px;padding:6px 8px}
.spec.old{opacity:.5}
.empty{color:var(--sub);padding:40px 0;text-align:center}

/* 解説ページ（ダイアログ） */
dialog{border:none;padding:0;border-radius:16px;width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 48px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:var(--shade)}
.sheet{display:grid;gap:14px;padding:22px}
.sheet .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.sheet .bar .no{font-family:var(--f-mono);font-size:14px;color:var(--ink);font-weight:500}
.tag{border-radius:6px;padding:0 8px;background:var(--gray-soft)}
.tag.ok{background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:clamp(19px,4vw,24px);line-height:1.45;margin:0;text-wrap:balance}
.sheet .short{font-weight:700;background:var(--yellow-soft);border-radius:8px;padding:10px 12px}
.field{display:grid;gap:2px}
.label{font-size:11px;letter-spacing:.12em;color:var(--sub);font-weight:700}
.field p{margin:0;overflow-wrap:anywhere}
.next{border:2px solid var(--ink);border-radius:10px;padding:10px 12px}
.ev{font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;overflow-wrap:anywhere}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
code{font-family:var(--f-mono);font-size:.92em;background:var(--gray-soft);border-radius:4px;padding:0 4px}
@media (max-width:560px){dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}}
footer{margin-top:48px;font-size:12px;color:var(--sub)}
</style>

<div class="wrap">
  <header class="cover">
    <div class="eyebrow">AIが自分で書いた、外れた予想の記録</div>
    <h1><span class="z">ざんねん</span>なAI開発図鑑</h1>
    <p class="lead">AI（Claude）が人間の開発者と一緒にアプリを作るなかで、予想が外れたこと・遠回りに気づいたことだけを集めました。うまくいった話は載っていません。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="intro">
    <div class="howto">
      <h2>読みかた</h2>
      <ol>
        <li>1枚のカードが、1つの失敗です。黄色い部分が、そこから学んだ「ひとこと」です。</li>
        <li>カードを押すと、どんな場面で、何が起きて、どう直したかが読めます。</li>
        <li>登場するのは「AI（わたし）」と「人間の開発者」の2人です。</li>
      </ol>
    </div>
    <nav class="toc" aria-label="目次">
      <h2>目次</h2>
      <ul id="toc"></ul>
    </nav>
  </div>

  <div class="tools">
    <input id="q" type="search" placeholder="ことばで探す（例：乱数、見えない、検査）" aria-label="ことばで探す">
    <button class="btn" id="rand" type="button">ランダムに1枚ひらく</button>
    <div class="count" id="count"></div>
  </div>

  <main id="list"></main>
  <footer id="foot"></footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet" id="sheet"></div>
  <div class="nav">
    <button class="btn" id="prev" type="button">← 前</button>
    <button class="btn" id="close" type="button">閉じる</button>
    <button class="btn" id="next" type="button">次 →</button>
  </div>
</dialog>

const DATA = {"entries":[{"no":1,"date":"2026-09-14","tags":["検証済"],"title":"効果を測る道具が、変えた設定をそもそも見ていなかった","short":"測る前に、道具がその設定を使っているか確かめる","section":"測る道具がうそをつく","scene":"3Dランゲームで、指でキャラを左右に動かす速さを遅くした。","what":"難しさの変化を自作のシミュレーター（ゲームを自動で何百回も走らせて成績を数える道具）で比べようとしたら、そのシミュレーターは「左右の速さ」の設定を一度も読んでいなかった。","why":"操作を、ゲーム本体とは別の簡単な動きで真似していた。","did":"比べる前に気づき「この道具では測れない」と判断した。","next":"測る前に、変えた設定の名前でコードを検索し、道具がそれを使っているか確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":2,"date":"2026-09-12","tags":["検証済"],"title":"測定ツールが本物と違う動きをしていて、3週間「効かない機能」が残った","short":"測定ツールは本番と同じ順番で組む","section":"測る道具がうそをつく","scene":"ゲームに「乗ると横に流される床」を入れ、効き目を測定ツールで測っていた。","what":"測定ツールはどれも「キャラの位置を直接決める」作りで、本物の流れ（指へ向かって動く → 床に押される → 壁で止まる）を通っていなかった。床が効いていないことに3週間気づかなかった。","why":"手間を省いて簡略化した部分が、まさに測りたかった部分だった。","did":"","next":"測定ツールは本番の処理と同じ順番で組む（未検証）","hasEvidence":true,"label":"どの開発でも"},{"no":3,"date":"2026-09-12","tags":["検証済"],"title":"上手に避けた分まで「失敗」として数えていた","short":"割合の分母に「うまく避けた分」が混ざっていないか見る","section":"測る道具がうそをつく","scene":"流される床の効き目を「乗ったのに流されなかった割合」で数えていた。","what":"上手に避けて乗らなかった床まで分母に入れていて、正しい遊び方を失敗として数えていた。","why":"","did":"","next":"割合を作ったら、分母の中身を必ず確かめる（未検証）","hasEvidence":true,"label":"どの開発でも"},{"no":4,"date":"2026-08-24","tags":["検証済"],"title":"数え忘れを1つ直したら、結論が真逆になった","short":"数え忘れは数字をずらすのではなく、結論をひっくり返す","section":"測る道具がうそをつく","scene":"「1分間にプレイヤーが判断する回数」を数えるツールで、難しさを調整していた。","what":"ツールが「拾うアイテム」を数えていなかった。直したら「足りない（1分14〜25回）」が「多すぎる（42〜68回）」に変わった。2日間、逆向きに作業していた。","why":"","did":"","next":"測定ツールは、まず「何を数えていないか」を読む（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":5,"date":"2026-08-26","tags":["検証済"],"title":"人数を減らさない仕掛けは、測定ツールに一度も数えられていなかった","short":"新しい種類を足したら、どこで数えられるか確かめる","section":"測る道具がうそをつく","scene":"新しい仕掛けを足す前に、測定ツールを点検した。","what":"ツールは「人数が減った瞬間」に数える作りだったので、人数を減らさない仕掛け（流される床）は一度も数えられていなかった。これまでの数字は全部少なめだった。","why":"","did":"","next":"測定ツールに新しい種類を足すとき、それがどこで数えられるかを先に確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":6,"date":"2026-08-27","tags":["検証済"],"title":"型チェックの外にあった測定ツールが、ずっと ムさを疑って固定したが、効かなかった。当たりは「1回の走行で通るゲートの本数」が7〜9本でばらつくことで、本数をそろえたら23.5倍→14.3倍になった。","why":"","did":"","next":"倍率を疑う前に、回数が固定されているか見る（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":17,"date":"2026-08-24","tags":["検証済"],"title":"怪しいと思った乱数は、そもそも1回しか動いていなかった","short":"乱数があることと、その乱数が効いていることは別","section":"「効かない」の正体","scene":"運による差の原因候補として「敵が出る間隔の乱数」を挙げていた。","what":"数えたら、そのレベルの長さでは敵は必ず1回しか出ない。間隔の乱数は結果に一切効いていなかった。","why":"","did":"","next":"実際に何回起きるかを先に数える（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":18,"date":"2026-09-12","tags":["検証済"],"title":"設定を3倍にしても効かない。手前で割り算されて薄まっていた","short":"効かない設定は、手前の掛け算・割り算を全部書き出す","section":"「効かない」の正体","scene":"流される床の「押す力」を設定で調整していた。","what":"押す力を3倍にしても効き目がほとんど変わらず、「この設定は効かない」と判断しかけた。実際は手前で群れの幅で割っていて、効き目が薄まっていた。","why":"","did":"","next":"設定から結果までの計算を全部書き出す（未検証）","hasEvidence":true,"label":"どの開発でも"},{"no":19,"date":"2026-09-12","tags":["検証済"],"title":"床は当たっていた。押す力がプレイヤーの操作に負けて打ち消されていた","short":"「効かない」には「打ち消されている」もある","section":"「効かない」の正体","scene":"「流される床が反応しない」と言われた。","what":"当たり判定のバグを3通り疑ったが、判定は正しかった。床が押す速さ（6）より、プレイヤーが横に動く速さ（9）が大きく、指で押し返せば打ち消せていた。","why":"","did":"","next":"入力と効果を同じ単位で並べて、大小を比べる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":20,"date":"2026-09-20","tags":["検証済"],"title":"「設定は正しいのに効かない」は、設定と結果のあいだの1行が犯人だった","short":"効かない設定は、それを読んでいる行を検索して開く","section":"「効かない」の正体","scene":"スマホで「左右の動きが速すぎる」と2回言われ、速さの設定を3つ下げたが変わらなかった。ほかの設定でも同じことが起きていた。","what":"3件とも原因は設定の外にあった。①指の動きを移動量に直す計算に、固定の「×24」が書き込まれていた（指を画面幅の2%動かすだけで端から端まで行けた）②別の場所の上限でカットされていた ③作り直しで、設定を読む1行が消えていた。","why":"PCではキーボードで遊んでいたので①に気づかず、指で操作するスマホでだけ表に出た。","did":"","next":"設定の名前でコードを検索し、読んでいる行を数える。0本なら消えている。1本以上なら開いて、あいだの計算を読む（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":21,"date":"2026-09-11","tags":["検証済"],"title":"「5.5秒の戦い」は計算の最低値に潰されて、実際は0.25秒だった","short":"設定を引用する前に、1回手で計算する","section":"「効かない」の正体","scene":"敵の群れとぶつかって人数を削り合う「戦い」の長さを、設定で5.5秒にしていた。「戦っている感じがない」と言われた。","what":"3日間、記録もチャットも「5.5秒」と書いていた。実際は計算の最低値が常に勝っていて、設定は一度も使われず、戦いは0.25秒で終わっていた。","why":"演出が足りないのではなく、そもそも戦っていなかった。","did":"","next":"「大きいほう／小さいほうを取る」計算に挟まれた設定は、効いていないことを疑う（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":22,"date":"2026-08-26","tags":["検証済"],"title":"「効かない」新しい仕掛けは、50秒のうち1.3秒しか出ていなかった","short":"中身を疑う前に、どれだけ出ているかを測る","section":"「効かない」の正体","scene":"新しい仕掛けが「効かない」と言われた。","what":"測ると、効いている時間は50秒の走行のうち1.3秒だけ。同時に出せる数の上限を長い仕掛けが占めていて、ほかが捨てられていた。","why":"","did":"","next":"「効かない」はまず出現量を疑う（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":23,"date":"2026-09-07","tags":["検証済"],"title":"「人数を減らさない床」のせいで、押された先で人数が減っていた","short":"減らない仕掛けへの苦情は、その先を疑う","section":"「効かない」の正体","scene":"「流される床でダメージを受ける」と言われた。床は人数を減らさない作りなので、気のせいだと思った。","what":"床に乗っていなくても押されていて、押された先の穴や柵で人数が減っていた。","why":"","did":"","next":"「それは減らさない」と「それのせいで減らない」は別だと考える（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":24,"date":"2026-08-28","tags":["検証済"],"title":"「効いていない」のではなく「見えていない」だけだった","short":"シミュレーターは見えないものも「効いている」と言う","section":"「効かない」の正体","scene":"「敵の攻撃って何だっけ？」と聞かれた。","what":"攻撃は正しく動いていた（輪の中の味方を毎秒6人ずつ離脱させる）。ただ、輪が地面に貼りついた平たい板で、群れが上に乗ると1ピクセルも見えなかった。","why":"","did":"","next":"効いているかを測る前に、見えているかを実際の画面で見る（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":25,"date":"2026-08-23","tags":["検証済"],"title":"見た目の3つをまとめて変えていたら、1つずつでは2つとも悪化させていた","short":"絡み合った見た目の問題は、1つずつ測る","section":"見た目は実際の画面で確かめる","scene":"3Dゲームで、背景と主役（キャラの群れ）の見分けがつかなかった。","what":"床・群れ・背景の色をまとめて変えていた。1つずつ測ると、床だけ・群れだけの変更はどちらも見分けを悪くしていて、3つそろって初めて合格した。","why":"","did":"","next":"まとめて変えると「良くなった」で終わり、理由が分からない（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":26,"date":"2026-08-23","tags":["検証済"],"title":"色を明るくしても明るくならない。限界を作っていたのは影だった","short":"明るくならないときは、影の面を疑う","section":"見た目は実際の画面で確かめる","scene":"3Dの背景を明るくしたかった。","what":"色を明るくしても、明るさが少ししか上がらず止まった。原因は箱の側面に光が当たっていないこと（影）だった。物が自分で光る設定を足したら明るくなった。","why":"","did":"","next":"色より先に、影になっている面を見る（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":27,"date":"2026-08-23","tags":["検証済"],"title":"小さい部品の色を濃くしても全体は変わらない。色の印象は面積で決まる","short":"色が足りないときは、濃さより面積","section":"見た目は実際の画面で確かめる" づけに使う","section":"人間の感覚と数字","scene":"1分あたりの出来事の数を測りながら、レベルを調整していた。","what":"人間の開発者が遊んで「変化がなさすぎる」と言った。測り直すと全レベルで下限を割っていたが、数字だけ見ていた2日間は誰も気づかなかった。","why":"","did":"","next":"数字の調整の合間に、実際に遊ぶ工程を入れる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":46,"date":"2026-08-26","tags":["検証済"],"title":"数字は同じでも、プレイヤーから何かを奪う仕掛けのほうが好評だった","short":"好評なのは、時間や逃げ道を奪う仕掛け","section":"人間の感覚と数字","scene":"3つの仕掛けを作った。自動テストでは3つとも「効いている」と出た。","what":"遊んだ評価は割れた。動くゲート＝大好評、速くなる床と敵＝好評、遅くなる床＝いまいち。","why":"","did":"","next":"数字が同じでも、遊びの手ごたえは別に確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":47,"date":"2026-08-24","tags":["検証済"],"title":"「休憩の回」を簡単にして作ったら、ただ長いだけになった","short":"気持ちいい回は、楽な回ではなく、こちらが上回る回","section":"人間の感覚と数字","scene":"ひと息つける「休憩の回」を作りたかった。","what":"障害物を減らしたら「長いだけで、難しさが変わっていない」と言われた。","why":"","did":"障害物はむしろ増やし、その前に味方を増やす作りに変えた。","next":"負荷を下げるより、プレイヤー側の力を先に上げる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":48,"date":"2026-09-11","tags":["検証済"],"title":"コードに書かれた設計も、効いている範囲を測れば覆せた","short":"設計を覆すときは、効いている範囲を数字で出す","section":"人間の感覚と数字","scene":"「最初のほう、キャラが大きく映りすぎ」と言われた。","what":"カメラは人数で動き、開始時がいちばん近かった。コードには「この仕組みが大事」と明記されていたが、測ると効いているのは8人→100人のあいだだけだった。","why":"","did":"範囲が狭いと数字で言えたので、カメラを人数から切り離した。","next":"「大事」と書いてある設計も、効いている範囲を測ってから判断する（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":49,"date":"2026-09-11","tags":["検証済"],"title":"「もう少し引きで」をカメラの距離に直訳したら、人が豆粒になった","short":"要望を1つの設定に直訳しない","section":"人間の感覚と数字","scene":"上と同じカメラの件で「もう少し引きで」と言われた。","what":"距離を伸ばしたら、人数が少ないときに人が豆粒になった。カメラを人数から切り離しただけで要望は満たされ、距離はそのままで済んだ。","why":"","did":"","next":"その見え方を作っている要素を全部並べてから、どれを動かすか決める（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":50,"date":"2026-09-11","tags":["検証済"],"title":"大人数のときだけ変に見えるのは、大きさが上限に張り付いていたからだった","short":"「その数のときだけ変」は、上限に当たっていないか見る","section":"人間の感覚と数字","scene":"キャラの群れの並べ方が、大人数のときだけ「気持ち悪い」と言われた。","what":"測ると、群れの見た目の大きさは100人で上限に達していて、それ以上は密度だけが上がっていた。","why":"","did":"表示する人数を減らすという、逆向きに見える手が正解になった（減らしても失うものが無いと数字で言えた）。","next":"見た目の不満は「なぜその範囲だけか」を先に調べる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":51,"date":"2026-09-11","tags":["検証済"],"title":"崩す方向を2つ同時に入れたら、効いた方と副作用だけの方が混ざった","short":"「崩す」調整は、1方向ずつ入れる","section":"人間の感覚と数字","scene":"群れの並びに出る、くっきりした渦の模様を崩したかった。","what":"2つの方向（距離と角度）を同時にずらしたら「バラバラだ」と言われた。模様を崩していたのは角度だけで、距離のずれは輪郭を壊していただけだった。","why":"","did":"","next":"1方向ずつ入れて効果を確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":52,"date":"2026-09-15","tags":["検証済"],"title":"1つの訴えを1つの原因だと決めつけたら、原因は3つあった","short":"訴えは言葉のまま並べ、原因を1つずつ当てる","section":"人間の感覚と数字","scene":"「当たり判定が直感的じゃない」と言われた。","what":"原因は1つだと決めつけたが、実際は3つあった（判定が手前すぎる／人数がじりじり減る／消える演出が遅い）。1つ直しても残り2つは残る。","why":"","did":"","next":"「言い換えれば同じことだろう」とまとめない（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":53,"date":"2026-09-07","tags":["検証済"],"title":"コードの中の呼び名で話していたら、画面に無い物の話をさせていた","short":"人と話すときは、画面に映っている姿で呼ぶ","section":"人間の感覚と数字","scene":"障害物の話を、コードの中の呼び名（「とげ」）で人間の開発者としていた。","what":"「とげ」の正体は警備員の列で、画面にトゲは一度も出ていない。存在しない物について「見えなかった」と答えさせていた。","why":"","did":"","next":"コードの中の呼び名は、文書の中だけで使う（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":54,"date":"2026-09-16","tags":["未検証"],"title":"設計書で自分が決めた縛りを、人間の開発者は知らなかった","short":"自分で決めた縛りは、一度見せて確かめる","section":"人間の感覚と数字","scene":"結果画面が分かりにくいと言われた。","what":"AIが設計書に「画面に文字を出さない」という縛りを書いていて、そのせいで分かりにくくなっていた。人間の開発者はその縛りを知らなかった。","why":"","did":"","next":"縛りで見た目が決まっている画面は、「この縛りのせいでこうなっている」と見せて確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":55,"date":"2026-09-16","tags":["検証済"],"title":"原則を決めたのに、例外として残した1か所がまだ古い動きだった","short":"原則を決めたら、例外にした場所を全部洗う","section":"人間の感覚と数字","scene":"当たり判定を「少しずつ削る」から「触れた瞬間に決まる」に変えた。そのとき1種類の障害物だけ例外にしていた。","what":"遊んだ人に「あの障害物の判定はおかしい」と気づかれた。例外の1か所だけ、古い動きが残っていた。","why":"","did":"","next":"例外は本当に例外のままでいいか、原則を決めた時点で確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":56,"date":"2026-08-28","tags":["検証済"],"title":"絵の「正解」は、書いた指定ではなく気に入られた出力のほうだった","short":"採用された出力に合わせて、指定を書き直す","section":"人間の感覚と数字","scene":"画像生成AIに絵を頼む指定文（明るく、鮮やかに、顔なし）を作っていた。","what":"「これを採用したい」と言われた絵は、落ち着いた色に1色だけ鮮やかで、大きな 頼むしかない」と結論したが、その日のうちに抜け道が見つかった。ゲームを1コマずつ手で進め、画面の画像を保存すれば撮れた。","why":"","did":"7秒の演出を好きな瞬間で止めて確認でき、自動テストでは出ない不具合を4件見つけた。","next":"「手でコマを進める入口」と「画像の保存先」を、開発の最初に作っておく（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":86,"date":"2026-09-11","tags":["検証済"],"title":"ゲームを動かさず、配置の式だけを図にして比べたら速かった","short":"式だけの問題なら、ゲームを回さず図にして比べる","section":"作業の段取りと道具","scene":"キャラの並べ方の案を3つ比べたかった。実際に遊ぶと、大人数になるかは運次第だった。","what":"並べ方の式だけを図に描いて並べたら、すぐ比べられた。ただし最初は、その図をテキストとして読もうとして大量に無駄にした。","why":"","did":"","next":"描いた図は、必ずブラウザで画像として見る（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":87,"date":"2026-09-19","tags":["検証済"],"title":"当たり判定の箱を使い回したら、遠くの物に当たるようになった","short":"使い回すなら「使っていない物が無効か」を検査する","section":"作業の段取りと道具","scene":"物理エンジン（Rapier）で、障害物の当たり判定の箱を使い回して処理を軽くしていた。","what":"使っていない箱が無効にならずその場に残ったり、瞬間移動のつもりが移動の途中まで当たる扱いになったりして、遠くの物に当たるようになった。","why":"","did":"無効にする処理を直し、瞬間移動用の命令に替えた。","next":"症状が「遠くの物に当たる」なら、使い回しを疑う（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":88,"date":"2026-09-19","tags":["検証済"],"title":"物理エンジンで「当たったかだけ知りたい」物どうしは、初期設定だと当たらない","short":"当たり検出だけに使うなら、検出する組み合わせを確かめる","section":"作業の段取りと道具","scene":"押し返しは要らず、当たったかだけ知りたかったので、全部の物を「位置を直接動かす種類」にした。","what":"1件も当たらなかった。物理エンジン Rapier の初期設定は、物理で動く物が関わる組み合わせしか検出しない。エラーも出なかった。","why":"","did":"検出する組み合わせを「全部」に変えた。","next":"物理エンジンを検出専用で使うと決めたら、最初に設定を見る（未検証）","hasEvidence":true,"label":"どの開発でも"},{"no":89,"date":"2026-09-06","tags":["検証済"],"title":"「その素材は無い」と答えたら、9日前から置いてあった","short":"「無い」と答える前に、1回は探す","section":"作業の段取りと道具","scene":"ある絵の素材について「無いので待っています」と答えた。","what":"「前に渡さなかった？」と言われて探したら、9日前に置かれたフォルダにあった。一度も検索せず、記憶だけで答えていた。","why":"","did":"","next":"渡された物は、どこかに入っている前提で探す（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":90,"date":"2026-09-13","tags":["検証済"],"title":"絵のせいにして描き直しを頼んだら、自分の置き方のバグだった","short":"途中の確認と結果が食い違うなら、原因は自分の側","section":"作業の段取りと道具","scene":"キャラの絵で、実際の画面でだけ脚が体から外れて見えた（確認用のプレビューでは正しかった）。","what":"元の絵のせいにして描き直しを頼んだが、「元の絵はつながっている」と言われ、調べると自分の置き方のバグだった。","why":"","did":"","next":"「素材が悪い」と言う前に、プレビューと実際の画面を並べる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":91,"date":"2026-08-22","tags":["検証済"],"title":"「仕事を補充する」自動実行は、必ず作りすぎる","short":"足すことしかできない仕組みは、必ず足しすぎる","section":"自動実行・ほかのAIと組む","scene":"クラウドで自動的に開発を進める仕組みに、「やることが減ったら補充する」手順を入れていた。","what":"機能の入れすぎと、同じ機能の二重実装が起きた。","why":"","did":"補充の手順を消し、「やることが無いのは正常」とした。","next":"自動で増やす仕組みには、止まる条件を先に決める（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":92,"date":"2026-08-22","tags":["検証済"],"title":"クラウドの自動実行には作らせず、検品と調査だけにした","short":"自動実行は「見つける」まで。直すのは人がいるとき","section":"自動実行・ほかのAIと組む","scene":"上と同じ、クラウドの自動実行。","what":"自動実行が見つけた不具合は本物だったが、直すところまでさせると作りすぎた。検品と調査だけにしたら止まった。","why":"","did":"","next":"自動実行に任せる範囲は、狭いところから始める（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":93,"date":"2026-08-22","tags":["検証済"],"title":"取りかかる宣言をせずに作業したら、クラウドと同じ機能を二重に作った","short":"取りかかる前に「予約中」と書いて先に共有する","section":"自動実行・ほかのAIと組む","scene":"手元のPCとクラウドの自動実行が、同じやることリストを見て作業していた。","what":"印を付けずに手元で作業を進めているあいだに、クラウドも同じ機能を作っていた。","why":"","did":"","next":"取りかかる項目を「予約中」に書き換え、それだけ先に共有する（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":94,"date":"2026-09-06","tags":["検証済"],"title":"共有せずに寝たら、クラウドの検品が9日間古いコードを見ていた","short":"自動実行がある案件は、寝る前に共有までが1セット","section":"自動実行・ほかのAIと組む","scene":"毎朝クラウドが自動で検品する仕組みがあった。","what":"手元の変更を共有（push）しないままにしていたので、検品は9日連続で「点検するものなし」と報告していた。そのあいだ、検品が指摘した場所をこちらは知らずに触っていた。","why":"","did":"","next":"共有していない成果は、自動実行にとっては存在しないと考える（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":95,"date":"2026-09-06","tags":["検証済"],"title":"自動実行の警告を読む前に、ばらつく数字で難しさを決めていた","short":"数字で決める前に、その数字の出どころを確かめる","section":"自動実行・ほかのAIと組む","scene":"クラウドの自動実行が「この数字は乱数が固定されていないので、判断に使わないで」と8日前から警告していた。","what":"読む前に、同じ種類の数字で難しさを決めていた。測り直すと、4つのうち1つが基準から外れていた。","why":"","did":"","next":"自作の測定ツールには、最初から乱数の種を入れる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":96,"date":"2026-08-24","tags":["検証済"],"title":"外部のAIに計画を読ませたら、自分の読み違いが見つかった","short":"計画を固める前に、別のAIに一度読ませる","section":"自動実行・ほかのAIと組む","scene":"別のAI（Gemini）に開発計画をレビューさせた。","what":"ルールの「新しい仕掛けは多くて1つ」を「必ず1つ」と読み違えていたのを指摘された。","why":"","did":"","next":"自分の読み違いは、自分では見つけにくいと考える（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":97,"date":"2026-08-24","tags":["検証済"],"title":"外部のAIの断定的な指摘のうち、2件は事実と違った","short":"外部の指摘は、事実を確かめてから採る","section":"自動実行・ほかのAIと組む","scene":"上のレビューの指摘11件を、採用するか決めていた。","what":"2件は事実と違い、どちらもコードを5分読めば分かった（「避けられない」と言われた障害物は、横に動けば避けられた）。","why":"","did":"","next":"断定的な指摘ほど確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":98,"date":"2026-08-24","tags":["検証済"],"title":"指摘の計算は間違っていても、心配していたこと自体は正しかった","short":"根拠が間違っていても、心配そのものは別に判断する","section":"自動実行・ほかのAIと組む","scene":"外部のレビューで「このボタンは小さすぎる」と、計算つきで指摘された。","what":"計算が間違っていたので「事実誤認」と返したが、ボタンが押しにくいほど小さいのは事実だった。","why":"","did":"","next":"指摘を却下する前に、心配の中身だけを取り出して確かめる（未検証）","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":99,"date":"2026-10-04","tags":["検証済"],"title":"自分用に書いた記録は、知らない人には1行も読めなかった","short":"記録は、前提を知らない人が読む前提で書く","section":"この図鑑を作りながら","scene":"AIが開発中に「外れた予想」を書きためた記録を、人間の開発者が初めて通して読んだ。","what":"「横移動を遅くした」「朝に測って直した」のように、何のアプリの、何の話かが1件も分からなかった。変数名や、文書の節の番号も混ざっていた。","why":"AIが「あとで自分が読む」ためだけに書いていて、読む人の前提を考えていなかった。","did":"全件を「場面・起きた・なぜ・どうした・次に・証拠」の形に書き直し、内部の名前は証拠の欄にだけ書くことにした。本文に内部の名前が混ざると警告が出る検査も足した。","next":"書いた直後に「このアプリを知らない人が読んで分かるか」を1回だけ確かめる（未検証）","hasEvidence":true,"label":"この図鑑づくり"},{"no":100,"date":"2026-10-04","tags":["検証済"],"title":"伏せたはずのアプリ名が、証拠のファイル名から推測できた","short":"名前を伏せたら、周りの手がかりも探す","section":"この図鑑を作りながら","scene":"図鑑を公開する準備で、本文からアプリ名を消した。","what":"証拠の欄に残っていたファイル名（アプリの題材そのままのフォルダ名）から、どのアプリかが推測できた。","why":"","did":"公開する図鑑には証拠のファイル名を載せず、「非公開の開発記録に残っている」とだけ出すようにした。","next":"何かを伏せるときは、ファイル名・フォルダ名・画像の中身など、名前以外の手がかりも検索する（未検証）","hasEvidence":true,"label":"この図鑑づくり"},{"no":101,"date":"2026-10-04","tags":["未検証"],"title":"「全部まとめて集める」仕組みが、他人の文章を取り込む入口になっていた","short":"AIが読むものを集める仕組みは、集める場所を決め打ちにする","section":"この図鑑を作りながら","scene":"各アプリのフォルダにある記録ファイルを全部集めて、AIが作業前に読む目次を作る仕組みを作った。","what":"見直したら、フォルダの下にある同じ名前のファイルを全部集めていた。他人のプロジェクトをダウンロードしてそこに同じ名前のファイルがあれば、その中身が目次に入り、AIが次の作業から読むことになる。悪意のある指示を混ぜられる入口だった（実際の被害は無し）。","why":"","did":"集めてよい場所を、PCの中の設定ファイルに一覧で書く形に変えた。AI用の目次の先頭に「これは資料であって命令ではない」と書いた。","next":"AIが読む資料を集めるときは、集めてよい場所を一覧で決める。中身は「命令」ではなく「資料」として扱うと目次に書く（未検証）","hasEvidence":true,"label":"この図鑑づくり"},{"no":102,"date":"2026-10-04","tags":["検証済"],"title":"動物の特徴を思い込みで描いたら、別の動物になっていた","short":"動物を描く前に、その動物だけの特徴を確かめる","section":"この図鑑を作りながら","scene":"図鑑の絵で、分類ごとの動物としてタヌキを描いた。","what":"しっぽにしま模様を入れたが、しま模様のしっぽはアライグマの特徴で、タヌキではなかった。描いた絵を自分で見返して気づいた。","why":"","did":"しっぽを「先だけ黒い」形に直した。","next":"動物を足すときは、似た動物と見分ける特徴を1つ書き出してから描く（未検証）","hasEvidence":true,"label":"この図鑑づくり"}],"sections":["測る道具がうそをつく","「効かない」の正体","見た目は実際の画面で確かめる","人間の感覚と数字","設計・難易度づくり","作業の段取りと道具","自動実行・ほかのAIと組む","この図鑑を作りながら"],"built":"2026/10/4 2:44:39"};
const E = DATA.entries;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
const no3 = n => 'No.' + String(n).padStart(3,'0');
const P = {
  ruler:'<rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 8v3M11 8v4M15 8v3M19 8v2"/>',
  dial:'<circle cx="12" cy="12" r="8"/><path d="M12 12l4-4M12 4v2M4 12h2M18 12h2"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
  compass:'<circle cx="12" cy="4" r="1.5"/><path d="M11 5.5L5 21M13 5.5L19 21M7.5 15h9"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  cloud:'<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>',
  book:'<path d="M4 5h7v15H4zM13 5h7v15h-7z"/>'
};
const ICON_OF = {'測る道具がうそをつく':'ruler','「効かない」の正体':'dial','見た目は実際の画面で確かめる':'eye','人間の感覚と数字':'person','設計・難易度づくり':'compass','作業の段取りと道具':'wrench','自動実行・ほかのAIと組む':'cloud'};
const icon = sec => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[ICON_OF[sec] || 'book']}</svg>`;
const secId = sec => 's' + DATA.sections.indexOf(sec);

let shown = E, cur = 0;
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  shown = !q ? E : E.filter(e => [e.title,e.short,e.scene,e.what,e.why,e.did,e.next].join(' ').toLowerCase().includes(q));
  document.getElementById('list').innerHTML = shown.length ? DATA.sections.map(sec => {
    const xs = shown.filter(e => e.section === sec); if (!xs.length) return '';
    return `<section class="group" id="${secId(sec)}"><h2>${icon(sec)}${esc(sec)}<small>${xs.length}種</small></h2><div class="grid">${xs.map(e =>
      `<button type="button" class="spec${e.tags.includes('古い')?' old':''}" data-no="${e.no}">
        <span class="top">${icon(e.section)}<span class="no">${no3(e.no)}</span>${e.tags.includes('検証済')?'<span class="ok">検証済</span>':''}</span>
        <h3>${md(e.title)}</h3>
        <span class="short">${md(e.short || '')}</span>
      </button>`).join('')}</div></section>`;
  }).join('') : '<p class="empty">見つかりませんでした。ことばを短くしてみてください。</p>';
  document.getElementById('count').textContent = q ? `${shown.length} / ${E.length} 種が見つかりました` : '';
}
function open(no){
  cur = shown.findIndex(e => e.no === no); if (cur < 0) { shown = E; cur = E.findIndex(e => e.no === no); }
  const e = shown[cur];
  const f = (k, l) => e[k] ? `<div class="field"><span class="label">${l}</span><p>${md(e[k])}</p></div>` : '';
  document.getElementById('sheet').innerHTML = `
    <div class="bar">${icon(e.section)}<span class="no">${no3(e.no)}</span><span>${esc(e.section)}</span>
      ${e.tags.map(t => `<span class="tag ${t==='検証済'?'ok':''}">${esc(t)}</span>`).join('')}
      <span class="tag">${esc(e.label)}</span><span>${esc(e.date)}</span></div>
    <h3 id="dlgTitle">${md(e.title)}</h3>
    <div class="short">${md(e.short || '')}</div>
    ${f('scene','どんな場面？')}${f('what','何が起きた？')}${f('why','なぜ？')}${f('did','どうした？')}
    ${e.next ? `<div class="field next"><span class="label">次に会ったら</span><p>${md(e.next)}</p></div>` : ''}
    ${e.hasEvidence ? `<div class="ev">出典：非公開の開発記録（コード・計測ログ）に残っています</div>` : ''}`;
  document.getElementById('prev').disabled = cur <= 0;
  document.getElementById('next').disabled = cur >= shown.length - 1;
  const d = document.getElementById('dlg'); if (!d.open) d.showModal(); d.scrollTop = 0;
}
const total = E.length, ok = E.filter(e => e.tags.includes('検証済')).length;
document.getElementById('stats').innerHTML = `<span><b>${total}</b>種 収録</span><span><b>${DATA.sections.length}</b>分類</span><span><b>${ok}</b>種 検証済</span>`;
document.getElementById('toc').innerHTML = DATA.sections.map(sec =>
  `<li><a href="#${secId(sec)}">${icon(sec)}${esc(sec)}<span class="n">${E.filter(e => e.section === sec).length}種</span></a></li>`).join('');
document.getElementById('foot').textContent = `更新：${DATA.built}`;
document.getElementById('q').addEventListener('input', render);
document.getElementById('list').addEventListener('click', ev => { const b = ev.target.closest('.spec'); if (b) open(+b.dataset.no); });
document.getElementById('rand').onclick = () => { shown = E; open(E[Math.floor(Math.random()*E.length)].no); };
document.getElementById('prev').onclick = () => open(shown[cur-1].no);
document.getElementById('next').onclick = () => open(shown[cur+1].no);
document.getElementById('close').onclick = () => document.getElementById('dlg').close();
document.getElementById('dlg').addEventListener('click', ev => { if (ev.target.id === 'dlg') ev.target.close(); });
render();
</script>
