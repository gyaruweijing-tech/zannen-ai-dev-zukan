<title>ざんねんなAI開発図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+1+Code:wght@400;500&display=swap">
<style>
/* 図鑑：白い紙に標本カードを並べる。表紙の黄色を1色だけ。カードを押すと標本の解説ページが開く */
:root{
  --paper:#fbfbf8; --card:#ffffff; --ink:#22262e; --sub:#5f6672; --line:#e2e0d6;
  --yellow:#f5c400; --yellow-soft:#fff5c2; --leaf:#2f8f5b; --leaf-soft:#e2f3e9; --gray-soft:#eef0f3;
  --shade:rgba(20,22,28,.45);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-mono:"M PLUS 1 Code",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1c21; --card:#23262c; --ink:#eceae4; --sub:#a9aeb7; --line:#373b43;
  --yellow:#f5c400; --yellow-soft:#3a3214; --leaf:#6fd09a; --leaf-soft:#1e3a2a; --gray-soft:#2c3038; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1c21; --card:#23262c; --ink:#eceae4; --sub:#a9aeb7; --line:#373b43;
  --yellow:#f5c400; --yellow-soft:#3a3214; --leaf:#6fd09a; --leaf-soft:#1e3a2a; --gray-soft:#2c3038; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 表紙 */
header.cover{display:grid;gap:12px;padding-block:16px 24px;border-bottom:3px solid var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--sub)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,7vw,60px);line-height:1.15;margin:0;text-wrap:balance}
h1 .z{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding-inline:.06em}
.lead{max-width:42em;margin:0;color:var(--sub)}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--sub)}
.stats b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}

/* はじめに・目次 */
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-block:28px}
.howto h2,.toc h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 10px}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:14px}
.toc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc a{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none}
.toc a:hover{border-color:var(--ink)}
.toc .n{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--sub)}

/* 検索 */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
#q{flex:1 1 240px;min-width:0;font:inherit;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus{border-color:var(--ink);outline:none}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--yellow);color:#22262e}
.btn:disabled{opacity:.35;cursor:default}
.count{font-size:13px;color:var(--sub);width:100%}
.count:empty{display:none}

/* 分類と標本カード */
section.group{margin-top:36px;scroll-margin-top:80px}
section.group h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
section.group h2 small{font-family:var(--f-body);font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.spec{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;min-width:0;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px 14px;overflow:hidden}
.pic{display:block;width:calc(100% + 28px);max-width:none;margin-inline:-14px;aspect-ratio:4/3;object-fit:cover;border-bottom:1px solid var(--line)}
.sheet .pic{width:100%;margin:0;border:1px solid var(--line);border-radius:12px}
.animal{font-size:13px;color:var(--sub);background:var(--gray-soft);border-radius:8px;padding:8px 10px}
.animal b{color:var(--ink)}
.kin{display:block;text-align:left;background:none;border:none;padding:2px 0;color:var(--leaf);text-decoration:underline;text-underline-offset:3px}
.toc .who{font-size:12px;color:var(--sub);margin-left:4px}
.spec:hover{border-color:var(--ink)}
.spec:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.spec .top{display:flex;align-items:center;gap:8px;color:var(--sub)}
.spec .no{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--ink)}
.spec .ok{margin-left:auto;font-size:11px;color:var(--leaf);font-weight:700}
.spec h3{font-family:var(--f-display);font-weight:400;font-size:15px;line-height:1.5;margin:0;text-wrap:pretty}
.spec .short{font-size:13px;line-height:1.6;color:var(--ink);background:var(--yellow-soft);border-radius:6px;padding:6px 8px}
.spec .seen{font-size:12px}
.spec .match{font-size:12px;color:var(--leaf);font-weight:700}
section.gate{background:var(--yellow-soft);border-radius:16px;padding:16px;margin-inline:-16px}
.exs{display:grid;gap:8px;margin-top:4px}
.ex{display:grid;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ex:hover{border-color:var(--ink)}
.ex .no{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.ex span:last-child{font-size:13px;color:var(--sub)}
.back{justify-self:start;background:none;border:none;padding:0;color:var(--leaf);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.promo{background:var(--leaf-soft);border-radius:10px;padding:10px 12px}
.promo .label{color:var(--leaf)}
.empty{color:var(--sub);padding:40px 0;text-align:center}

/* 解説ページ（ダイアログ） */
dialog{border:none;padding:0;border-radius:16px;width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 48px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:var(--shade)}
.sheet{display:grid;gap:14px;padding:22px}
.sheet .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.sheet .bar .no{font-family:var(--f-mono);font-size:14px;color:var(--ink);font-weight:500}
.tag{border-radius:6px;padding:0 8px;background:var(--gray-soft)}
.tag.ok{background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:clamp(19px,4vw,24px);line-height:1.45;margin:0;text-wrap:balance}
.sheet .short{font-weight:700;background:var(--yellow-soft);border-radius:8px;padding:10px 12px}
.field{display:grid;gap:2px}
.label{font-size:11px;letter-spacing:.12em;color:var(--sub);font-weight:700}
.field p{margin:0;overflow-wrap:anywhere}
.next{border:2px solid var(--ink);border-radius:10px;padding:10px 12px}
.ev{font-size:12px;color:var(--sub);border-top:1px dashed var(--line);padding-top:10px;overflow-wrap:anywhere}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
code{font-family:var(--f-mono);font-size:.92em;background:var(--gray-soft);border-radius:4px;padding:0 4px}
@media (max-width:560px){dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}}
footer{margin-top:48px;font-size:12px;color:var(--sub)}
</style>

<div class="wrap">
  <header class="cover">
    <div class="eyebrow">AIが自分で書いた、外れた予想の記録</div>
    <h1><span class="z">ざんねん</span>なAI開発図鑑</h1>
    <p class="lead">AI（Claude）が人間の開発者と一緒にアプリを作るなかで、予想が外れたこと・遠回りに気づいたことだけを集めました。うまくいった話は載っていません。</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="intro">
    <div class="howto">
      <h2>読みかた</h2>
      <ol>
        <li>1枚のカードが、1つの「種」（同じ型の失敗）です。黄色い部分が、その種から学んだ「まとめ」です。</li>
        <li>カードを押すと、その種の「目撃例」が並びます。目撃例を押すと、どんな場面で、何が起きて、どう直したかが読めます。</li>
        <li>登場するのは「AI（わたし）」と「人間の開発者」の2人です。</li>
      </ol>
    </div>
    <nav class="toc" aria-label="目次">
      <h2>目次</h2>
      <ul id="toc"></ul>
    </nav>
  </div>

  <div class="tools">
    <input id="q" type="search" placeholder="ことばで探す（例：乱数、見えない、検査）" aria-label="ことばで探す">
    <button class="btn" id="rand" type="button">ランダムに1件ひらく</button>
    <div class="count" id="count"></div>
  </div>

  <main id="list"></main>
  <footer id="foot"></footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet" id="sheet"></div>
  <div class="nav">
    <button class="btn" id="prev" type="button">← 前</button>
    <button class="btn" id="close" type="button">閉じる</button>
    <button class="btn" id="next" type="button">次 →</button>
  </div>
</dialog>

測って「正しい」とした処理が、本物の流れでは二重にダメージを与えていた","short":"「正しい」と言う前に、本物の呼ばれ方で通して測る","section":"測る道具がうそをつく","scene":"3Dゲームの「数式でゲートを選ぶ」モードで、人間の開発者が「後半のステージはバグが多すぎる」と言った。ゲームを自動で何本も走らせて原因を探した。","guess":"自動の検品は「障害物のダメージ計算は正しい」と記録していたので、原因は別の場所だと思っていた。","what":"障害物に1回触れるだけで、10の20乗人の群れが1人になっていた。障害物は「桁を減らす」ダメージを与えたあと、続けて「触れ始めたときの人数の何割か」も引いていた。桁が減ってずっと小さくなった人数から、元の大きな人数の45%を引くので、全滅していた。自動で180本走らせると、69本がこれで1人に落ちていた。","why":"検品は「桁を減らす」部品だけを取り出して測っていた。そのすぐ後に続く引き算は、部品の外にあったので見えなかった。","found":"本物のゲームを画面の描画なしで動かし、人数を変える処理を全部くるんで「いつ・何が・何人減らしたか」を記録したら、1本目で出た。","after":"引く割合を「桁を減らしたあとの今の人数」に掛け直した。同じ条件の180本で、障害物で1人に落ちた走行は0本になった。人間の開発者が遊んで「理不尽に死ななくなった」と言った。","next":"「この部分は正しい」と書く前に、その部分を本物のゲームの流れで通して測る。部品だけの測定なら「部品だけ」と書く（未検証）","kin":[82],"app":"群れを率いて走る3Dゲーム（開発中）。道にあるゲートを通ると、味方の人数が足し算・掛け算で増える。障害物や敵にぶつかると減る。途中でライバルの群れやボスと戦い、ゴールでは人数を使って段を登る。","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":109,"sp":2,"date":"2026-10-06","tags":["検証済"],"title":"「同じ札ばかり出る」を式の種類で数えたら均等で、見た目で数えたら上位3枚で43%だった","short":"人が「同じ」と感じる単位で数える","section":"測る道具がうそをつく","scene":"3Dゲームの「数式でゲートを選ぶ」モードで、人間の開発者が「結局同じ3〜5種類の式から選んでいる気がする」と言った。何周も自動で走らせて、どの式が何割出るかを数えた。","guess":"式の種類の配り方が偏っていて、一部の種類ばかり出ているのだと思っていた。","what":"320周・4,374枚を数えると、式の種類ごとには全部14%前後でほぼ均等だった（誤差±1ポイント）。ところが、数字が入る種類（n²、√n など）は見た目が何十通りにばらけるのに、数字の入らない種類（三角数・2のn乗・nの階乗など）は毎回まったく同じ見た目だった。見た目で数えると、序盤は上位3枚で43%を占めていた。しかも、そのうち2枚は式も効き目もほぼ同じだった。","why":"配る仕組みは「種類」を均等にしていたが、人が「同じだ」と感じるのは見た目のほうだった。","found":"先に試しに80周回し、ばらつきから必要な周回数（各80周）を計算してから本番を回した。種類と見た目の両方で数えたら、食い違いがはっきり出た。","after":"人間の開発者は「いったん出す」と決め、直すのは公開のあとにした。","next":"「同じものばかり」と言われたら、仕組みの単位ではなく、画面で見える単位で数える（未検証）","kin":[],"app":"群れを率いて走る3Dゲーム（開発中）。道にあるゲートを通ると、味方の人数が足し算・掛け算で増える。障害物や敵にぶつかると減る。途中でライバルの群れやボスと戦い、ゴールでは人数を使って段を登る。","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":110,"sp":5,"date":"2026-10-06","tags":["検証済"],"title":"炎に入れる熱を「1秒あたり」で小さく置いたら、炎がほとんど見えなかった","short":"湧き出す量は「そこに居る時間×量」で見積もる","section":"「効かない」の正体","scene":"焚き火のアプリで、炎を気体の流れの計算で描いていた。燃えている所から熱いガスを湧き出させる量を、設定の数字で決めた。","guess":"1秒あたりの熱を2.2にすれば、炎の形になるくらいの温度が出ると思っていた。","what":"炎は根元に薄い赤が出るだけだった。熱いガスはすぐ上へ流れ去るので、熱源の上に居る時間が約0.02秒しかなく、温度は0.02ほどにしかならなかった。38に上げて初めて炎の形が出た。燃え移りの計算も、測る前は小枝が最高73℃で一度も燃えていなかった。","why":"「1秒あたりの量」だけで見積もり、流れに運ばれて熱源の上に居る時間の短さを掛け忘れていた。","found":"画面を作る前に、温度を数字で出す小さなシミュレーターを先に作って測った。","after":"熱の量を上げ、燃え移りの温度も測りながら合わせた。","next":"流れの中に何かを湧き出させるときは、「そこに居る時間×1秒あたりの量」で、実際にたまる量を先に計算する（未検証）","kin":[],"app":"画面の中で焚き火を起こして眺めるアプリ（開発中）。炎や煙を気体の流れの計算で描き、新聞紙・小枝・薪が温度で燃え移っていく。マッチで火をつける。","hasEvidence":true,"label":"焚き火のシミュレーター"},{"no":111,"sp":8,"date":"2026-10-06","tags":["検証済"],"title":"自動テストはマウスを押しっぱなしにしていて、「クリックだとマッチが一瞬で消える」に気づけなかった","short":"操作のテストは、人がやるいちばん素朴な操作でやる","section":"見た目は実際の画面で確かめる","scene":"焚き火のアプリで、マッチで新聞紙に火をつける操作を作り、自動テストで火がつくのを確かめていた。","guess":"自動テストで毎回火がついたので、人が遊んでも火がつくと思っていた。","what":"人間の開発者が初めて遊んだら「マッチで全然燃えない」と言った。マッチは押している間だけ燃える作りで、人はクリック（押してすぐ離す）するのでマッチが一瞬で消えていた。自動テストは5秒押しっぱなしにしていたので毎回燃えていた。ほかにも、新聞紙が真円で転がって山の下から逃げ、狭い画面ではマッチのボタンが棚に隠れていた。","why":"テストの操作を「火がつくまで押す」という、仕組みを知っている人の操作で書いていた。","found":"","after":"クリックでも燃えるように直した。","next":"操作の自動テストは、知らない人がまずやる操作（1回クリック・狭い画面）で書く（未検証）","kin":[],"app":"画面の中で焚き火を起こして眺めるアプリ（開発中）。炎や煙を気体の流れの計算で描き、新聞紙・小枝・薪が温度で燃え移っていく。マッチで火をつける。","hasEvidence":true,"label":"焚き火のシミュレーター"},{"no":112,"sp":18,"date":"2026-10-06","tags":["検証済"],"title":"配布用のzipを作ったつもりが、中身はzipではない別の形式だった","short":"作ったファイルは、形式まで確かめる","section":"作業の段取りと道具","scene":"3Dゲームを公開するため、ゲームのファイルを1つの圧縮ファイル（zip）にまとめていた。","guess":"Windows で使った手順と同じ書き方なので、zipができると思っていた。","what":"エラーは出ず、中身の一覧も表示されたが、できたのはzipではなくtarという別の形式だった。公開サイトに上げていたら受け付けられなかった。","why":"同じ名前の圧縮コマンドが2つあり、使った方（Linux系の環境のもの）は「拡張子に合わせて形式を選ぶ」指定を無視していた。","found":"ファイルの形式を調べるコマンドで見たら、zipではなかった。","after":"Windows に付いている方のコマンドで作り直した。","next":"配る・上げるファイルを作ったら、一覧だけでなく形式も確かめる（未検証）","kin":[],"app":"群れを率いて走る3Dゲーム（開発中）。道にあるゲートを通ると、味方の人数が足し算・掛け算で増える。障害物や敵にぶつかると減る。途中でライバルの群れやボスと戦い、ゴールでは人数を使って段を登る。","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":113,"sp":19,"date":"2026-10-06","tags":["検証済"],"title":"ブラウザを操作する道具の待ち時間切れで、ゲームの計算が途中で止まり壊れた","short":"重い反復はページの中で裏回しして、結果だけ取りに行く","section":"作業の段取りと道具","scene":"3Dゲームを、AIが操作するブラウザの中で何十本も自動で走らせて、ダメージの不具合を探していた。","guess":"1回の命令でまとめて走らせれば、早く終わると思っていた。","what":"約60秒で命令が打ち切られ、計算の途中で止まった当たり判定の部品が壊れて、以後の走行が全部エラーになった。","why":"ブラウザを操作する道具には1回あたりの待ち時間の上限があり、それを超えると実行中の処理ごと止められる。","found":"","after":"ページの中で1本ずつ順番に裏で走らせて結果をためておき、数十秒ごとに途中経過だけ読みに行く形にしたら、180本でも320本でも止まらずに回った。","next":"ブラウザの中で重い反復をするときは、最初から裏回しにして、結果だけを取りに行く（未検証）","kin":[],"app":"群れを率いて走る3Dゲーム（開発中）。道にあるゲートを通ると、味方の人数が足し算・掛け算で増える。障害物や敵にぶつかると減る。途中でライバルの群れやボスと戦い、ゴールでは人数を使って段を登る。","hasEvidence":true,"label":"開発中の3Dゲーム"},{"no":114,"sp":24,"date":"2026-10-06","tags":["検証済"],"title":"「コミットは公開用のアドレスで」という決まりがあったのに、公開中の2つのリポジトリで本物のメールが全コミットに残っていた","short":"決まりは、過去のコミットを直さない","section":"この図鑑を作りながら","scene":"作ったアプリを全部公開する前提で、公開前の決まり（個人情報を出さない一覧）を作った日に、すでに公開しているリポジトリ8個を全履歴まで調べた。","guess":"全体の設定はとっくに公開用のアドレス（GitHub が用意する、本人につながらないメール）にしてあるので、問題は出ないと思っていた。","what":"2つのリポジトリで、作者のメールが本物のメールになっていた（5件と3件。片方は作者名も）。リポジトリごとの設定か、全体の設定を変える前に作ったコミットが残っていた。","why":"決まりを書いただけで、止める仕組みが無かった。自動の検査があったのは、この図鑑のリポジトリだけだった。","found":"決まりを作ったその日に、決まりどおりか全履歴を検査した。","after":"全リポジトリ共通の、コミット前・push 前の自動検査を作った。漏れていたリポジトリは作り直した。","next":"決まりを作ったら、その日に過去の分まで機械で検査する。決まりだけで守っている所は、もう漏れていると思って調べる（未検証）","kin":[115],"app":"","hasEvidence":true,"label":"どの開発でも"},{"no":115,"sp":3,"date":"2026-10-07","tags":["検証済"],"title":"一度「履歴をきれいに作り直した」のに、作者名で本名が出ていた","short":"メールを直しても、名前は直っていなかった","section":"測る道具がうそをつく","scene":"公開中のリポジトリから個人情報を消すため、数か月前に履歴を作り直していた。今回、公開前の共通検査を新しく作って、全リポジトリを調べ直した。","guess":"作り直したリポジトリはもう大丈夫だと思っていた。","what":"作り直しではメールだけを公開用に変え、作者名は全体設定の本名のままだった。公開中の4つで作者名に本名が出ていた。最初の点検（メールと本文だけを見る自作の小さな道具）でも見逃し、作者名の欄まで見る検査を作って初めて出た。新しい検査は、最初のコミットで全体設定の名前を止めた。","why":"点検する道具が「作者名」という欄をそもそも見ていなかった。見ていない欄は、何が入っていても合格になる。","found":"","after":"全体設定の作者名を、本名ではない名前に変えた。4つは作り直した。","next":"個人情報を消すときは、コミットの全部の欄（作者・コミッター・名前・メール・本文）を並べて、検査がどれを見ているかを書き出す（未検証）","kin":[114],"app":"","hasEvidence":true,"label":"どの開発でも"},{"no":116,"sp":3,"date":"2026-10-07","tags":["検証済"],"title":"新旧の検査を比べたら、旧版は「0件」と出たが、実は1行も動いていなかった","short":"比べる相手が壊れていたら、差は全部うそ","section":"測る道具がうそをつく","scene":"公開前の共通検査を強くした。強くしたことで引っかかる件数がどれだけ増えるかを、全リポジトリで新旧を並べて数えようとした。","guess":"旧版は前と同じように動いて、新版との差が「強くした分」になるはずだと思っていた。","what":"旧版を、名前の後ろに「控え」の印を付けたファイルに控えて走らせたら、実行する側がそのファイルを読めずにすぐ止まっていた。件数を数える側は止まったことに気づかず「0件」と表示。新版が全リポジトリで数十〜数百件増えたように見えた。控えの名前を元に戻して比べ直すと、本当に増えたのは数件だけだった。","why":"数える側は「見つかった行」を数えるだけで、検査が最後まで動いたかを見ていなかった。","found":"増え方が大きすぎたので、旧版を1つのリポジトリで直接走らせたらエラーが出ていた。","after":"","next":"新旧を比べる前に、両方を1件ずつ手で走らせて、ちゃんと最後まで動くかを見る。「0件」は「動いていない」かもしれない（未検証）","kin":[115],"app":"","hasEvidence":true,"label":"どの開発でも"},{"no":117,"sp":16,"date":"2026-10-07","tags":["検証済"],"title":"表記ゆれの対策を入れたら、2〜4文字の言葉が普通の文に当たった","short":"網を細かくすると、小魚まで捕まる","section":"設計・難易度づくり","scene":"公開前の共通検査は「出してはいけない言葉」の一覧で文を調べる。書き方の違い（カタカナとひらがな、空白やハイフンの有無）でもすり抜けないよう、比べる前に文字をそろえる処理を足した。","guess":"そろえれば、すり抜けが減るだけだと思っていた。","what":"2文字の言葉がひらがなの普通の言葉に、4文字の言葉が「単語-単語」のハイフンを消したつなぎ目に当たった。全リポジトリで新旧を比べて気づいた。","why":"短い言葉ほど、そろえたあとの文の中に偶然現れやすい。","found":"","after":"文字をそろえて比べるのは5文字以上の言葉だけにした。新旧の差は3件だけになった。","next":"検査を強くしたら、入れる前に全リポジトリで新旧を比べ、増えた件を1件ずつ見る（未検証）","kin":[],"app":"","hasEvidence":true,"label":"どの開発でも"},{"no":118,"sp":16,"date":"2026-10-07","tags":["検証済"],"title":"3Dの形のデータを文字に変えて検査に通したら、文字の並びが偶然「出してはいけない言葉」と一致して止まり、直す途中でPCの中の場所まで書き込んだ","short":"でたらめな文字の長い列は、いつか何かの言葉を含む","section":"設計・難易度づくり","scene":"3Dの岩の形のデータ（中身を読めない形式）が、公開前の検査で「中身を確かめられない」と止められた。形のデータを文字（base64：データを英数字の並びに置き換える方式）にして、形を表す本体の中に埋め込もうとした。","guess":"文字にすれば検査が中身を読めるので、通るはずだと思っていた。","what":"約7MBの文字の並びの中に、禁止の一覧にある短い言葉がたまたま現れて止まった。数字だけの形に変えて通した（文字が無いので偶然の一致が起きない）。その変換の途中で、ファイルの場所の区切りをまちがえて割ったため、PCの中の場所がまるごとファイルに書き込まれた。出力を自分で開いて読んで気づき、名前だけにした。","why":"検査を通すための変換を、通ったかどうかだけで確かめていた。変換したあとの中身は見ていなかった。","found":"","after":"数字の形を元のデータへ戻して読み込む処理を足し、画面で岩が出ることを確かめた。","next":"検査を通すために形を変えたら、変えたあとの中身を開いて読む（未検証）","kin":[117],"app":"画面の中で焚き火を起こして眺めるアプリ（開発中）。炎や煙を気体の流れの計算で描き、新聞紙・小枝・薪が温度で燃え移っていく。マッチで火をつける。","hasEvidence":true,"label":"焚き火のシミュレーター"},{"no":119,"sp":16,"date":"2026-10-07","tags":["検証済"],"title":"湿った木だけに効かせるつもりの式を足したら、新聞紙まで燃えなくなった","short":"1つの材料のために足した式が、別の材料を壊す","section":"設計・難易度づくり","scene":"焚き火のアプリで、湿った木は燃えにくく煙が多い、を再現したかった。木から出る湯気が燃えるガスより多いと、炎が付かない式を足した。","guess":"湿った木にだけ効くと思っていた。乾いた物は湯気が少ないので関係ないはずだった。","what":"新聞紙（水分5%）まで炎が付かなくなった（炎の続く時間 31秒 → 0秒）。燃え始めの一瞬は、乾いた紙でも湯気がガスと同じくらい出るためだった。湿った木の測定だけで合わせていた。","why":"","found":"全部の場面（マッチだけ・火おこし・熾火の上に1本・1時間）を回し直したら、火おこしで新聞紙が燃えていなかった。","after":"「いまの水分が20%を超えたら効く」に変えた。新聞紙の炎は1分に戻った。","next":"1つの材料・場面のために式を足したら、全部の場面を回し直す（未検証）","kin":[117],"app":"画面の中で焚き火を起こして眺めるアプリ（開発中）。炎や煙を気体の流れの計算で描き、新聞紙・小枝・薪が温度で燃え移っていく。マッチで火をつける。","hasEvidence":true,"label":"焚き火のシミュレーター"},{"no":120,"sp":18,"date":"2026-10-07","tags":["検証済"],"title":"炎や煙を1枚の板の使い回しで描いたら、クリックの判定が見えない板に吸われ、材料の山がつかめなかった","short":"見えない物も、クリックの判定には見えている","section":"作業の段取りと道具","scene":"3Dの焚き火で、炎・火の粉・煙を、1枚の四角い板を何百個も使い回す描き方（インスタンス描画）で描いた。薪の山をクリックしてつかむ操作を作った。","guess":"炎の絵はクリックの判定に関係ないと思っていた。","what":"クリックの判定は、使い回す元の板（1m四方・世界の中心）をそのまま当たりとして扱っていた。焚き火台がちょうど中心にあるので、画面の真ん中あたりのクリックが全部その見えない板に当たり、「見回す」操作になっていた。エラーは何も出なかった。","why":"","found":"クリックした所で、判定が最初に当たった物の名前を出したら、薪ではなく名前の無い板だった。","after":"炎・火の粉・煙の3つを、クリックの判定から外した。","next":"クリックが効かないときは、判定が最初に当たった物を名前で出して見る（未検証）","kin":[],"app":"画面の中で焚き火を起こして眺めるアプリ（開発中）。炎や煙を気体の流れの計算で描き、新聞紙・小枝・薪が温度で燃え移っていく。マッチで火をつける。","hasEvidence":true,"label":"焚き火のシミュレーター"},{"no":121,"sp":18,"date":"2026-10-07","tags":["検証済"],"title":"画面が隠れた状態で重さの測定を回したら、1分たっても1件目が終わらなかった","short":"隠れたタブでは、時計が止まりかける","section":"作業の段取りと道具","scene":"3Dの焚き火の重さを、部品を1つずつ外しながら測る道具を作った。確かめ用のブラウザ欄は、ふだん隠れている。","guess":"測定は数十秒で終わると思っていた。","what":"隠れているタブでは、コマ送りが止まり、時間待ちも最大1分に1回まで間引かれる。待ちに時間待ちを使っていたので、ほとんど進まなかった。エラーは出ず、ただ終わらなかった。","why":"","found":"測定の途中の番号を外から読んだら、1件目の39コマ目のままだった。","after":"画面が見えている間に、ふだんのコマ送りに乗って数える形にした。14件が約1分で終わった。","next":"ブラウザで時間のかかる処理を回すときは、タブが隠れていても進む作りか先に確かめる（未検証）","kin":[],"app":"画面の中で焚き火を起こして眺めるアプリ（開発中）。炎や煙を気体の流れの計算で描き、新聞紙・小枝・薪が温度で燃え移っていく。マッチで火をつける。","hasEvidence":true,"label":"焚き火のシミュレーター"},{"no":122,"sp":20,"date":"2026-10-07","tags":[ const secId = sec => 's' + DATA.sections.indexOf(sec);

const S = DATA.species;
const spOf = id => S.find(s => s.id === id);
const n2 = n => '第' + n + '種';
const pv = (s, q) => q ? s.nos.filter(n => hit(E[n-1], q)).length : 0;
const hit = (e, q) => [e.title,e.short,e.scene,e.guess,e.what,e.why,e.found,e.after,e.next].join(' ').toLowerCase().includes(q);

// いま開いているもの：種（kind 'sp'）か目撃例（kind 'ex'）。前・次は同じ並びの中で動く
let shownSp = S, view = null;
function card(s, q){
  const rep = E[s.rep-1], m = pv(s, q);
  return `<button type="button" class="spec" data-sp="${s.id}">
    ${rep.pic ? `<img class="pic" src="${rep.pic}" alt="" loading="lazy">` : ''}
    <span class="top">${icon(s.section)}<span class="no">${n2(s.id)}</span><span class="seen">目撃 ${s.nos.length}件</span>${s.promo?'<span class="ok">AIに取り込み済み</span>':''}</span>
    <h3>${md(s.name)}</h3>
    <span class="short">${md(s.summary)}</span>
    ${q ? `<span class="match">ことばに合う目撃例 ${m}件</span>` : ''}
  </button>`;
}
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  shownSp = !q ? S : S.filter(s => pv(s, q) > 0);
  const gate = S.filter(s => s.gate);
  const head = !q && gate.length ? `<section class="group gate" id="gate"><h2>まずはこの10種<small>はじめての人はここから</small></h2><div class="grid">${gate.map(s => card(s)).join('')}</div></section>` : '';
  document.getElementById('list').innerHTML = shownSp.length ? head + DATA.sections.map(sec => {
    const xs = shownSp.filter(s => s.section === sec); if (!xs.length) return '';
    return `<section class="group" id="${secId(sec)}"><h2>${icon(sec)}${esc(sec)}<small>${xs.length}種</small></h2><div class="grid">${xs.map(s => card(s, q)).join('')}</div></section>`;
  }).join('') : '<p class="empty">見つかりませんでした。ことばを短くしてみてください。</p>';
  const m = q ? shownSp.reduce((a, s) => a + pv(s, q), 0) : 0;
  document.getElementById('count').textContent = q ? `${shownSp.length}種・目撃例 ${m}件が見つかりました` : '';
}
function show(){
  const d = document.getElementById('dlg'); if (!d.open) d.showModal(); d.scrollTop = 0;
  const L = view.kind === 'sp' ? shownSp : spOf(E[view.no-1].sp).nos;
  const i = view.kind === 'sp' ? L.indexOf(spOf(view.id)) : L.indexOf(view.no);
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = i >= L.length - 1;
  document.getElementById('prev').textContent = view.kind === 'sp' ? '← 前の種' : '← 前の目撃例';
  document.getElementById('next').textContent = view.kind === 'sp' ? '次の種 →' : '次の目撃例 →';
}
const animal = sec => DATA.animals[sec] ? `<div class="animal">この分類のいきもの：<b>${esc(DATA.animals[sec].name)}</b>　${esc(DATA.animals[sec].why)}</div>` : '';
function openSp(id){
  if (!shownSp.includes(spOf(id))) shownSp = S;
  const s = spOf(id), rep = E[s.rep-1]; view = { kind: 'sp', id };
  document.getElementById('sheet').innerHTML = `
    <div class="bar">${icon(s.section)}<span class="no">${n2(s.id)}</span><span>${esc(s.section)}</span><span class="tag">目撃 ${s.nos.length}件</span></div>
    ${rep.pic ? `<img class="pic" src="${rep.pic}" alt="">` : ''}
    <h3 id="dlgTitle">${md(s.name)}</h3>
    <div class="short">${md(s.summary)}</div>
    ${s.promo ? `<div class="field promo"><span class="label">AIに取り込み済み（${esc((s.promo.match(/^\[(.+?)\]/)||[,''])[1])}）</span><p>${md(s.promo.replace(/^\[.+?\]\s*/,''))}</p></div>` : ''}
    <div class="field"><span class="label">目撃例（押すと、どんな場面で何が起きたかが読めます）</span>
      <div class="exs">${s.nos.map(n => { const e = E[n-1]; return `<button type="button" class="ex" data-no="${n}"><span class="no">${no3(n)}</span><b>${md(e.title)}</b><span>${md(e.short||'')}</span></button>`; }).join('')}</div></div>
    ${animal(s.section)}`;
  show();
}
function openEx(no){
  const e = E[no-1], s = spOf(e.sp); view = { kind: 'ex', no };
  const f = (k, l) => e[k] ? `<div class="field"><span class="label">${l}</span><p>${md(e[k])}</p></div>` : '';
  document.getElementById('sheet').innerHTML = `
    <button type="button" class="back" data-sp="${s.id}">← ${n2(s.id)}「${esc(s.name)}」にもどる</button>
    <div class="bar">${icon(e.section)}<span class="no">${no3(e.no)}</span><span>${esc(e.section)}</span>
      ${e.tags.map(t => `<span class="tag ${t==='検証済'?'ok':''}">${esc(t)}</span>`).join('')}
      <span class="tag">${esc(e.label)}</span><span>${esc(e.date)}</span></div>
    ${e.pic ? `<img class="pic" src="${e.pic}" alt="">` : ''}
    <h3 id="dlgTitle">${md(e.title)}</h3>
    <div class="short">${md(e.short || '')}</div>
    ${e.app ? `<div class="animal"><b>このアプリ</b>　${esc(e.app)}</div>` : ''}
    ${f('scene','どんな場面？')}${f('guess','AIの予想（最初はこう考えていた）')}${f('what','実際に起きたこと')}${f('why','なぜ？')}${f('found','どうやって気づいた？')}${f('after','その後')}
    ${e.kin && e.kin.length ? `<div class="field"><span class="label">なかま（つながっている失敗）</span><p>${e.kin.map(n => `<button type="button" class="kin" data-no="${n}">${no3(n)} ${esc(E[n-1].title)}</button>`).join('')}</p></div>` : ''}
    ${e.next ? `<div class="field next"><span class="label">次に会ったら</span><p>${md(e.next)}</p></div>` : ''}
    ${animal(e.section)}
    ${e.hasEvidence ?`<div class="ev">出典：非公開の開発記録（コード・計測ログ）に残っています</div>` : ''}`;
  show();
}
function step(d){
  if (view.kind === 'sp') { const i = shownSp.indexOf(spOf(view.id)); openSp(shownSp[i+d].id); }
  else { const L = spOf(E[view.no-1].sp).nos; openEx(L[L.indexOf(view.no)+d]); }
}
const ok = E.filter(e => e.tags.includes('検証済')).length;
document.getElementById('stats').innerHTML = `<span><b>${S.length}</b>種</span><span><b>${E.length}</b>件の目撃例</span><span><b>${DATA.sections.length}</b>分類</span><span><b>${ok}</b>件 検証済</span>`;
document.getElementById('toc').innerHTML = DATA.sections.map(sec =>
  `<li><a href="#${secId(sec)}">${icon(sec)}${esc(sec)}${DATA.animals[sec] ? `<span class="who">（${esc(DATA.animals[sec].name)}）</span>` : ''}<span class="n">${S.filter(s => s.section === sec).length}種</span></a></li>`).join('');
document.getElementById('foot').textContent = `更新：${DATA.built}`;
document.getElementById('q').addEventListener('input', render);
document.getElementById('list').addEventListener('click', ev => { const b = ev.target.closest('.spec'); if (b) openSp(+b.dataset.sp); });
document.getElementById('rand').onclick = () => openEx(E[Math.floor(Math.random()*E.length)].no);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => document.getElementById('dlg').close();
document.getElementById('dlg').addEventListener('click', ev => { if (ev.target.id === 'dlg') ev.target.close(); });
document.getElementById('sheet').addEventListener('click', ev => {
  const x = ev.target.closest('.ex,.kin'); if (x) return openEx(+x.dataset.no);
  const b = ev.target.closest('.back'); if (b) openSp(+b.dataset.sp);
});
render();
</script>
